services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: synapse
    volumes:
      - synapse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    image: synapse:release-${RELEASE_REV}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      SYNAPSE_ENCRYPTION_KEY: ${SYNAPSE_ENCRYPTION_KEY}
      DEFAULT_AI_PROVIDER: ${DEFAULT_AI_PROVIDER:-anthropic}
    ports:
      - "127.0.0.1:3070:3000"
    volumes:
      - synapse_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && node server.js"

volumes:
  synapse_pgdata:
  synapse_uploads:
