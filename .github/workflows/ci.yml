name: CI Build

# Canonical pull-request verification workflow. No deploy and no production secrets required.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://synapse_ci:synapse_ci@127.0.0.1:5432/synapse_ci?schema=public

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: synapse_ci
          POSTGRES_PASSWORD: synapse_ci
          POSTGRES_DB: synapse_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synapse_ci -d synapse_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to disposable PostgreSQL
        run: npx prisma migrate deploy

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          CI: true
