name: Build and Push Image

# Container validation is intentionally path-scoped on pull requests because
# the canonical CI workflow already type-checks, lints, tests and builds every
# application change. Default-branch pushes and version tags still publish the
# full multi-arch image, except CI/docs-only default-branch changes.

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main, master]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_call:
    inputs:
      image_name:
        description: 'Override image name (default: repo name)'
        required: false
        type: string
      dockerfile:
        description: 'Path to Dockerfile (default: ./Dockerfile)'
        required: false
        type: string
        default: 'Dockerfile'
      platforms:
        description: 'Buildx platforms (default: amd64 + arm64)'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    name: Validate image without publication
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile || 'Dockerfile' }}
          platforms: linux/amd64
          push: false
          tags: synapse:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=synapse-image
          cache-to: type=gha,mode=max,scope=synapse-image
          provenance: false
          sbom: false

      - name: Pull request validation summary
        run: |
          {
            echo "## Image validated without publication"
            echo ""
            echo "The pull-request image built for linux/amd64."
            echo "No write-capable token, registry login, image push, SBOM attestation, or release tag mutation occurred."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: github.event_name != 'pull_request'
    name: Build & push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve image metadata
        id: meta
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          if [ -n "${{ inputs.image_name }}" ]; then REPO_NAME="${{ inputs.image_name }}"; fi
          REPO_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/* ]]; then
            TAG="${REF#refs/tags/}"
            TAG="${TAG//\//-}"
          elif [[ "$REF" == refs/heads/main || "$REF" == refs/heads/master ]]; then
            TAG="main"
          else
            TAG="${REF#refs/heads/}"
            TAG="${TAG//\//-}"
          fi
          SHA_SHORT=$(echo "${{ github.sha }}" | head -c 7)
          {
            echo "image=ghcr.io/camster91/${REPO_NAME}"
            echo "tag=${TAG}"
            echo "sha=${SHA_SHORT}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile || 'Dockerfile' }}
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}-${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=synapse-image
          cache-to: type=gha,mode=max,scope=synapse-image
          provenance: true
          sbom: true
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

      - name: Image summary
        run: |
          {
            echo "## Image published"
            echo ""
            echo "**Image:** \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`"
            echo "**Pull:** \`docker pull ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`"
            echo "**Run:** \`docker run -d -p 3000:3000 --name ${{ github.event.repository.name }} ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`"
            echo ""
            echo "**Platforms:** ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}"
            echo "**SHA:** ${{ steps.meta.outputs.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
